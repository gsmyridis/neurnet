repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-symlinks
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --no-sync --no-cache ruff check --extend-select T10
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync --no-cache ruff format
        language: system
        types: [python]
      - id: tests
        name: Python tests
        entry: uv run --no-sync --no-cache python -m unittest discover -s tests
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
